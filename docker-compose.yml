services:
  allbot:
    build: .
    image: allbot:latest
    pull_policy: build
    environment:
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
    volumes:
      - allbot_data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  allbot_data: